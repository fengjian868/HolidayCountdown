name: Bug 反馈
description: 报告插件运行中遇到的问题
title: "（将此栏【替换】为你的标题）"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您进行 Bug 反馈。请在上面的文本框起一个能够清晰描述您的问题的标题，便于开发者解决您的问题。

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > 如果要提出**多个** Bug，请为每一个 Bug 开一个单独的 issue。

        如果您不知道如何有效、精准地表述，我们建议您先阅读《[提问的智慧](https://github.com/ryanhanwu/How-To-Ask-Questions-The-Smart-Way/blob/main/README-zh_CN.md)》。

  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单
      description: 在开始反馈这个问题之前，请先检查：
      options:
        - label: 我已更新到最新版测试，并确认这一 Bug 还没有修复。我也已在 Issues 中检索，确认这一 Bug 未被提交过。
          required: true
        - label: 我已知晓并同意，此处仅用于汇报程序中存在的问题（关于其他非程序本身的问题应当在 Discussion 板块提出）。
          required: true

  - type: textarea
    id: bug_info
    attributes:
      label: Bug 信息
      description: 描述您遇到的 Bug。您可以附上截图、录屏、堆栈跟踪、日志等材料，便于开发者追踪问题。
      placeholder: 请在此描述 Bug 的详细情况……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
      description: 详细地描述您期望发生的行为，突出与目前（可能不正确的）行为的不同。
      placeholder: 请在此描述期望的行为……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生的行为。
      placeholder: 请在此描述实际结果……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤
      description: 详细描述要怎么操作才能再次触发这个 Bug。
      placeholder: |
        1. 首先……
        2. 然后……
        3. ……
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图/录屏（可选，建议）
      description: 如果可能，请提供可以用来进一步描述您的问题的截图或录屏。上传附件时请优先使用 GitHub 的附件系统，尽量避免使用需要登录或安装客户端才能接收附件的网盘。
      placeholder: 可拖拽图片或粘贴到此处
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息（可选）
      description: 插件版本、ClassIsland 版本、操作系统版本等。
      placeholder: |
        - 插件版本：1.3.1.2
        - ClassIsland 版本：2.1.0.0
        - 操作系统：Windows 11 23H2
    validations:
      required: false
