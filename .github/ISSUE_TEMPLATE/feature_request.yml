name: 功能请求
description: 提出新的功能建议或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请描述清楚功能场景和预期效果。

  - type: input
    id: title
    attributes:
      label: 功能标题
      description: 一句话概括这个功能
      placeholder: 例如：支持自定义倒计时精度
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 使用场景
      description: 这个功能在什么场景下会用到？解决了什么问题？
      placeholder: |
        例如：
        我希望能把课间倒计时精确到秒，
        这样学生能更清楚还有多久上课。
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 具体希望插件怎么做？
      placeholder: |
        例如：
        1. 在设置页增加「倒计时精度」选项
        2. 可选「只显示分钟」或「显示到秒」
        3. 组件根据设置动态刷新
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 如果没有这个功能，你目前是怎么处理的？或者有没有其他实现思路？
      placeholder: 例如：目前只能看系统时间手动估算
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他想补充的内容、参考截图或设计稿
      placeholder: 可拖拽图片到此处
    validations:
      required: false
