name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Zip Artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath ./HolidayCountdown.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HolidayCountdown-${{ github.sha }}
          path: ./HolidayCountdown.zip
