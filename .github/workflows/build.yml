name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Clean up runtime files
        run: |
          Remove-Item -Recurse -Force ./publish/runtimes/linux-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/osx-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/freebsd-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/android-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/ios-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/unix-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/browser-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/maccatalyst-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/tvos-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/watchos-* -ErrorAction SilentlyContinue

      - name: Zip Artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath ./HolidayCountdown.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HolidayCountdown
          path: ./HolidayCountdown.zip

      - name: Generate Build Summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $runId = "${{ github.run_id }}"
          $repo = "${{ github.repository }}"
          $artifactName = "HolidayCountdown"
          $nightlyLink = "https://nightly.link/$repo/actions/runs/$runId/$artifactName.zip"
          $ghproxyLink = "https://ghproxy.com/$nightlyLink"
          $mirrorLink = "https://mirror.ghproxy.com/$nightlyLink"
          
          echo "## Build Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Version:** debug-$sha-${{ github.run_number }}" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### Download" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- [Download Artifact](https://github.com/$repo/actions/runs/$runId)" >> $env:GITHUB_STEP_SUMMARY
          echo "- [Nightly.link Download]($nightlyLink) (GhProxy Fastly Mirror / GhProxy Mirror)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "_Job summary generated at run-time_" >> $env:GITHUB_STEP_SUMMARY
