name: Refresh Weather

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.repository == 'fengjian868/HolidayCountdown'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Weather Refresh
        run: dotnet run --project ./HolidayCountdown.csproj --no-build --configuration Release -- weather-refresh
        env:
          CI: true
