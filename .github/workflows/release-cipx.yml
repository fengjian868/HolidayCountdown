name: Build CIPX

# 专门生成 ClassIsland 插件包 (.cipx) 的工作流
# cipx 本质是 zip 包，包含编译产物 + manifest.yml + icon.png + 入口 dll

on:
  push:
    branches: [main, master, refactor/axaml-split]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-cipx:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: dotnet publish --no-build --configuration Release --output ./publish

      - name: Copy plugin files to publish
        run: |
          # 复制插件元数据与资源文件到 publish 目录
          Copy-Item -Path ./HolidayCountdown.csproj -Destination ./publish/ -ErrorAction SilentlyContinue
          Copy-Item -Path ./icon.png -Destination ./publish/ -ErrorAction SilentlyContinue
          Copy-Item -Path ./manifest.yml -Destination ./publish/ -ErrorAction SilentlyContinue
          Copy-Item -Path ./Plugin.cs -Destination ./publish/ -ErrorAction SilentlyContinue
          Copy-Item -Path ./README.md -Destination ./publish/ -ErrorAction SilentlyContinue
          Copy-Item -Path ./.gitignore -Destination ./publish/ -ErrorAction SilentlyContinue
          # 清理不需要的运行时文件（仅保留 Windows x64）
          Remove-Item -Recurse -Force ./publish/runtimes/linux-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/osx-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/freebsd-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/android-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/ios-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/unix-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/browser-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/maccatalyst-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/tvos-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force ./publish/runtimes/watchos-* -ErrorAction SilentlyContinue

      - name: Read version from manifest
        id: version
        shell: pwsh
        run: |
          # 从 manifest.yml 读取版本号，用于命名 cipx 文件
          $content = Get-Content ./manifest.yml -Raw
          if ($content -match 'version:\s*(.+)') {
            $ver = $matches[1].Trim()
            echo "version=$ver" >> $env:GITHUB_OUTPUT
            Write-Host "Plugin version: $ver"
          } else {
            echo "version=unknown" >> $env:GITHUB_OUTPUT
          }

      - name: Pack CIPX
        run: |
          # 生成 .cipx 插件包（本质是 zip，改后缀为 .cipx）
          $version = "${{ steps.version.outputs.version }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          # tag 触发用 tag 名，其他用 版本-sha
          $refName = "${{ github.ref_name }}"
          $artifactName = if ($refName -like 'v*') { "HolidayCountdown-$version.cipx" } else { "HolidayCountdown-$version-$sha.cipx" }
          echo "artifactName=$artifactName" >> $env:GITHUB_ENV
          if (Test-Path ./$artifactName) { Remove-Item -Force ./$artifactName }
          Compress-Archive -Path ./publish/* -DestinationPath ./$artifactName
          Write-Host "Generated: $artifactName"
          Get-Item ./$artifactName | Format-List Name,Length,FullName

      - name: Upload CIPX Artifact
        uses: actions/upload-artifact@v4
        with:
          # artifact name 用简洁名（不含点号），避免 nightly.link 路由解析歧义。
          # 下载得到的总是 zip（upload-artifact v4 机制），解压后即为 .cipx 文件。
          name: HolidayCountdown-cipx
          path: ./${{ env.artifactName }}
          if-no-files-found: error

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.artifactName }}
          generate_release_notes: true

      - name: Generate Build Summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $runId = "${{ github.run_id }}"
          $repo = "${{ github.repository }}"
          $version = "${{ steps.version.outputs.version }}"
          $artifactName = "${{ env.artifactName }}"
          # nightly.link 的 URL 必须以 .zip 结尾（upload-artifact v4 总是把内容打包成 zip）
          $nightlyLink = "https://nightly.link/$repo/actions/runs/$runId/HolidayCountdown-cipx.zip"
          $ghproxyLink = "https://ghproxy.com/$nightlyLink"
          $mirrorLink = "https://mirror.ghproxy.com/$nightlyLink"

          echo "## CIPX 插件包构建" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- **版本:** $version" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **产物文件:** \`$artifactName\`" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### 下载（得到 .zip，解压后即为 .cipx）" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- [GitHub Actions 下载](https://github.com/$repo/actions/runs/$runId)" >> $env:GITHUB_STEP_SUMMARY
          echo "- [Nightly.link 下载]($nightlyLink)" >> $env:GITHUB_STEP_SUMMARY
          echo "- [GhProxy 加速镜像]($ghproxyLink)" >> $env:GITHUB_STEP_SUMMARY
          echo "- [GhProxy 镜像]($mirrorLink)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### 安装方法" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "1. 点击上方链接下载 \`.zip\` 文件" >> $env:GITHUB_STEP_SUMMARY
          echo "2. **解压** zip，得到 \`.cipx\` 文件（不要直接用 zip 安装）" >> $env:GITHUB_STEP_SUMMARY
          echo "3. 在 ClassIsland 中：设置 → 插件 → 从文件安装 → 选择 \`.cipx\` 文件" >> $env:GITHUB_STEP_SUMMARY
          echo "_注：GitHub Actions artifact 总是以 zip 形式提供，需先解压取出 cipx_" >> $env:GITHUB_STEP_SUMMARY
