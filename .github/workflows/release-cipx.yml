name: Build CIPX

# 使用 ClassIsland.PluginSdk 内置的 CreateCipx target 打包
# CreateCipx 会在 dotnet build 后自动把 $(OutputPath) 打包为 .cipx
# 不使用 dotnet publish，因此不会带出 runtime 和多余的依赖 dll

on:
  push:
    branches: [main, master, refactor/axaml-split]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-cipx:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (CreateCipx target 自动打包)
        run: dotnet build --no-restore --configuration Release

      - name: Read version from manifest
        id: version
        shell: pwsh
        run: |
          $content = Get-Content ./manifest.yml -Raw
          if ($content -match 'version:\s*(.+)') {
            $ver = $matches[1].Trim()
            echo "version=$ver" >> $env:GITHUB_OUTPUT
            Write-Host "Plugin version: $ver"
          } else {
            echo "version=unknown" >> $env:GITHUB_OUTPUT
          }

      - name: Rename CIPX with version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $refName = "${{ github.ref_name }}"
          # tag 触发用版本名，其他用 版本-sha
          $artifactName = if ($refName -like 'v*') { "HolidayCountdown-$version.cipx" } else { "HolidayCountdown-$version-$sha.cipx" }
          # CreateCipx 生成在 cipx/HolidayCountdown.cipx
          $src = "./cipx/HolidayCountdown.cipx"
          if (-not (Test-Path $src)) {
            Write-Error "CIPX not found at $src"
            exit 1
          }
          Copy-Item $src ./$artifactName
          echo "artifactName=$artifactName" >> $env:GITHUB_ENV
          Write-Host "Generated: $artifactName"
          Get-Item ./$artifactName | Format-List Name,Length,FullName

      - name: Upload CIPX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HolidayCountdown-cipx
          path: ./${{ env.artifactName }}
          if-no-files-found: error

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.artifactName }}
          generate_release_notes: true

      - name: Generate Build Summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $runId = "${{ github.run_id }}"
          $repo = "${{ github.repository }}"
          $version = "${{ steps.version.outputs.version }}"
          $artifactName = "${{ env.artifactName }}"
          $nightlyLink = "https://nightly.link/$repo/actions/runs/$runId/HolidayCountdown-cipx.zip"
          $ghproxyLink = "https://ghproxy.com/$nightlyLink"
          $mirrorLink = "https://mirror.ghproxy.com/$nightlyLink"

          echo "## CIPX 插件包构建" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- **版本:** $version" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **产物文件:** \`$artifactName\`" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### 下载（得到 .zip，解压后即为 .cipx）" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- [GitHub Actions 下载](https://github.com/$repo/actions/runs/$runId)" >> $env:GITHUB_STEP_SUMMARY
          echo "- [Nightly.link 下载]($nightlyLink)" >> $env:GITHUB_STEP_SUMMARY
          echo "- [GhProxy 加速镜像]($ghproxyLink)" >> $env:GITHUB_STEP_SUMMARY
          echo "- [GhProxy 镜像]($mirrorLink)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### 安装方法" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "1. 点击上方链接下载 \`.zip\` 文件" >> $env:GITHUB_STEP_SUMMARY
          echo "2. **解压** zip，得到 \`.cipx\` 文件（不要直接用 zip 安装）" >> $env:GITHUB_STEP_SUMMARY
          echo "3. 在 ClassIsland 中：设置 → 插件 → 从文件安装 → 选择 \`.cipx\` 文件" >> $env:GITHUB_STEP_SUMMARY
          echo "_注：GitHub Actions artifact 总是以 zip 形式提供，需先解压取出 cipx_" >> $env:GITHUB_STEP_SUMMARY
